# spell-checker:ignore wasip
name: low-priority-targets

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  wasi:
    name: check wasi
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@1.100.0
      with:
        targets: wasm32-wasip1
    - name: install wasi-sdk
      run: |
        curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
        echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-33.0-x86_64-linux" >> "$GITHUB_ENV"
    - name: check
      run: cargo check --target wasm32-wasip1

  windows:
    name: check windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: check
      run: cargo check

  # some unix specific crates might reject windows while it supports this...
  cygwin:
    name: check cygwin
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: setup toolchain
      shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}'
      run:  pacman -Sy --noconfirm --needed rust clang
    - name: check
      shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}'
      env:
        CHERE_INVOKING: 1
      run: cargo check --target x86_64-pc-cygwin
