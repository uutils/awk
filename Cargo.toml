[package]
name = "uu_awk"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "awk"
path = "src/main.rs"

[[bin]]
name = "pwcat"
path = "src/bin/pwcat.rs"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["interpreter","lexer", "parser"]

[workspace.dependencies]
lexer.path = "./lexer"
parser.path = "./parser"
interpreter.path = "./interpreter"
either = "1.15.0"
memchr = "2.8.0"
thiserror = "2.0.18"
smallvec = { version = "1.15.1", features = ["union", "const_generics", "const_new", "write"] }
bumpalo = { version = "3.20.2", features = ["boxed", "collections", "std", "allocator-api2"] }
hashbrown = "0.17.0"
allocator-api2 = "0.4.0"
ahash = "0.8.12"
derive_more = { version = "2.1.1", features = ["from", "debug", "display"] }
regex = "1.12.3"
ariadne = "0.6.0"
atoi = "3.1.0"

[dependencies]
lexer.workspace = true
interpreter.workspace = true
parser.workspace = true
either.workspace = true
memchr.workspace = true
thiserror.workspace = true
bumpalo.workspace = true
clap = { version = "4.6.1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
comfy-table = "8.0.0"

[dev-dependencies]
ctor = "1.0"
uutests = "0.10"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
debug = true

# A release-like profile that is as small as possible.
[profile.release-small]
inherits = "release"
opt-level = "z"
strip = true

# A release-like profile with debug info for profiling.
# See https://github.com/mstange/samply .
[profile.profiling]
inherits = "release"
panic = "unwind"
debug = true

[lints]
workspace = true

# This is the linting configuration for all crates.
# In order to use these, all crates have `[lints] workspace = true` section.
[workspace.lints.rust]
# Allow "fuzzing" as a "cfg" condition name and "cygwin" as a value for "target_os"
# https://doc.rust-lang.org/nightly/rustc/check-cfg/cargo-specifics.html
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(fuzzing)',
  'cfg(target_os, values("cygwin"))',
  'cfg(wasi_runner)',
] }
unused_qualifications = "warn"

[workspace.lints.clippy]
# Groups
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Restrictions
print_stderr = "warn"
print_stdout = "warn"

# Casts; TODO: replace with fancy std methods when available
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# Others (mostly, curated nursery lints)
assigning_clones = "warn"
branches_sharing_code = "warn"
fallible_impl_from = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
large_stack_frames = "warn"
missing_const_for_fn = "warn"
needless_collect = "warn"
set_contains_or_insert = "warn"
use_self = "warn"
useless_let_if_seq = "warn"

# Shut up
cargo_common_metadata = "allow"
fn_params_excessive_bools = "allow"
format_push_string = "allow"
ignored_unit_patterns = "allow"
inline_always = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
should_panic_without_expect = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
